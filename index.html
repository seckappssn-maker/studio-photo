<style>
/* Layout: colonna unica da telefono, banda nero caldo con filo ambra in alto, barra schede in basso */
:root{
  --bg:#F3F0EC; --surface:#FFFFFF; --surface2:#F8F6F3; --ink:#1C1714; --muted:#6A5F58; --line:#E2DAD2;
  --indigo:#8A2D3B; --indigo-ink:#FFFFFF; --band:#17120F; --band-ink:#F6EEE6;
  --gold:#9A5B00; --gold-soft:#FBEBD0; --gold-line:#E8B04B;
  --ok:#1D7348; --ok-soft:#DDF2E6; --warn:#A85A07; --warn-soft:#FBEBD5; --bad:#B42318; --bad-soft:#FBE1DE;
  --chip:#EDE6DF; --shadow:0 1px 2px rgba(28,23,20,.06),0 4px 14px rgba(28,23,20,.07);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110D0B; --surface:#1C1613; --surface2:#241D19; --ink:#F3ECE6; --muted:#B5A79D; --line:#3A2F29;
  --indigo:#F08A97; --indigo-ink:#110D0B; --band:#0B0807; --band-ink:#F6EEE6;
  --gold:#F2C46B; --gold-soft:#3A2A10; --gold-line:#E8B04B;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#2B221D; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110D0B; --surface:#1C1613; --surface2:#241D19; --ink:#F3ECE6; --muted:#B5A79D; --line:#3A2F29;
  --indigo:#F08A97; --indigo-ink:#110D0B; --band:#0B0807; --band-ink:#F6EEE6;
  --gold:#F2C46B; --gold-soft:#3A2A10; --gold-line:#E8B04B;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#2B221D; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.aname{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitch{height:0;border-top:2px solid var(--gold-line);opacity:.9}
.mode{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;flex:none}
.mode button{border:0;background:none;color:var(--band-ink);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.mode button.on{background:var(--gold-line);color:#1B1606}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:24px;line-height:1.15}
h2{font-size:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.fete{background:var(--gold-soft);border:1.5px dashed var(--gold-line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.fete b{font-family:var(--f-display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.thumb{width:48px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--indigo);flex:none}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.st-coupe,.st-couture,.st-finition{background:var(--warn-soft);color:var(--warn)}
.st-pret{background:var(--ok-soft);color:var(--ok)}
.st-recu{background:var(--chip);color:var(--indigo)}
.st-livre{background:var(--chip);color:var(--muted)}
.reste{font-size:12.5px;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.solde{font-size:12.5px;font-weight:700;color:var(--ok)}
.bad{color:var(--bad)!important;font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--indigo);color:var(--indigo-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.gold{background:var(--gold-line);color:#1B1606}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--indigo);color:var(--indigo-ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--indigo)}
nav.tabs svg{width:23px;height:23px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* catalogue */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--chip);max-width:100%}
.card-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card-t{font-weight:700;font-size:14.5px;line-height:1.25}
.price{font-family:var(--f-display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.tag{position:absolute;top:8px;left:8px;background:var(--gold-line);color:#1B1606;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.hbtn{border:1px solid rgba(255,255,255,.3);background:none;color:var(--band-ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.hchip{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);color:var(--band-ink);white-space:nowrap}
.hchip.ok{background:#1F7A4D;color:#fff}.hchip.warn{background:var(--gold-line);color:#1B1606}.hchip.bad{background:#C0392B;color:#fff}
.sync{font-size:12px;opacity:.85;white-space:nowrap}.sync.err{color:#FFB4A9;opacity:1}
.code{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--gold)}
.linkbox{background:var(--surface2);border:1px dashed var(--gold-line);border-radius:10px;padding:10px 12px;font-size:13.5px;word-break:break-all;user-select:all}
.imgw{position:relative}
.pcount{position:absolute;bottom:8px;right:8px;background:rgba(10,12,30,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcell{position:relative;aspect-ratio:4/5;max-width:100%}
.pcell img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.pcover{position:absolute;left:5px;bottom:5px;background:var(--gold-line);color:#1B1606;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.pdel,.pmove{position:absolute;top:5px;border:0;width:28px;height:28px;border-radius:50%;background:rgba(10,12,30,.72);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.pdel{right:5px}.pmove{left:5px;font-size:13px}
.padd{aspect-ratio:4/5;max-width:100%;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;text-align:center;padding:4px}
.padd span{font-size:28px;line-height:1;color:var(--indigo)}
.padd small{font-size:11.5px;font-weight:600}
.gal{position:relative;border-radius:14px;overflow:hidden;background:var(--chip)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;max-height:380px;object-fit:contain;scroll-snap-align:center}
.gal-n{position:absolute;top:10px;right:10px;background:rgba(10,12,30,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dots i.on{background:#fff;width:18px;border-radius:9px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,12,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mes{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mes .f input{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv b{font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.money b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.money span{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.step{border:0;background:var(--chip);border-radius:9px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.step i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5}
.step.done{background:var(--indigo);color:var(--indigo-ink)}
.step.done i{opacity:1}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-line);border-radius:9px}
.photo-big{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:var(--chip)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:64px;height:76px;object-fit:cover;border-radius:10px}
.msg{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.reply{background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:96px}
.act svg{width:26px;height:26px;color:var(--gold)}
.act b{font-size:14.5px}
.act span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90%}
.note{font-size:12.5px;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
<style>
.timeline{display:flex;flex-direction:column;gap:8px}
.ses{border:0;background:var(--surface);border-radius:14px;padding:11px 13px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);border-left:4px solid var(--line);width:100%;min-width:0}
.ses.prevu{border-left-color:var(--indigo)}.ses.fait{border-left-color:var(--warn)}.ses.livre{border-left-color:var(--ok)}.ses.annule{opacity:.6}
.st-prevu{background:var(--chip);color:var(--indigo)}.st-fait{background:var(--warn-soft);color:var(--warn)}.st-livre{background:var(--ok-soft);color:var(--ok)}.st-annule{background:var(--chip);color:var(--muted)}
.dbox{width:50px;flex:none;text-align:center;border-radius:10px;background:var(--surface2);padding:6px 2px;line-height:1.1}
.dbox b{display:block;font-family:var(--f-display);font-size:20px}.dbox small{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.big-total{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.navd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-b{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:13.5px}
.mode-b.on{border-color:var(--indigo);background:var(--indigo);color:var(--indigo-ink)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media (min-width:520px){.pg{grid-template-columns:repeat(4,1fr)}}
.pt{position:relative;border:0;padding:0;background:var(--chip);aspect-ratio:1;border-radius:8px;overflow:hidden;display:block;width:100%}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt .ck{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
.pt.sel .ck{background:var(--indigo);box-shadow:inset 0 0 0 3px #fff}
.pt.sel img{opacity:.75}
.pt .pub{position:absolute;left:5px;bottom:5px;background:var(--gold-line);color:#1B1606;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px}
.meter{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}.meter i{display:block;height:100%;background:var(--indigo);border-radius:999px}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.ann{border-radius:18px;overflow:hidden;background:var(--band);color:var(--band-ink);box-shadow:var(--shadow);display:flex;flex-direction:column}
.ann img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ann .ab{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px}
.ann h2{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0}
.ann .cd{display:inline-flex;align-self:flex-start;background:var(--gold-line);color:#1B1606;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
.ann .sm2{font-size:13.5px;opacity:.85}

const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};

const dayLabel=s=>{const d=daysTo(s);return d===0?'Aujourd’hui':d===1?'Demain':d===-1?'Hier':dateFr(s,{weekday:'long',day:'numeric',month:'long'})};
const fmt=n=>Math.round(+n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' F';

  ];

function fixState(o){if(!o)return o;['clients','seances','services','annonces'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});if(!Array.isArray(o.demandes))o.demandes=[];

/* ---------- photos : compression ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
function toBlob(img,max,qual){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*r);cv.height=Math.round(img.naturalHeight*r);
  const cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',qual))}
const blobToData=b=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)});
async function prepPhoto(file){const img=await loadImg(file);
  let full=await toBlob(img,ONLINE?1920:900,ONLINE?.8:.7);if(full&&full.size>1900000)full=await toBlob(img,1600,.7);
  const thumb=await toBlob(img,ONLINE?480:300,.65);URL.revokeObjectURL(img.src);return {full,thumb}}
/* upload a batch: opts {clientId, seanceId, pub, cat} */
async function addPhotos(list,opts,onp){list=[...list].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!list.length){toast('Choisissez des photos');return 0}
  const room=ONLINE?quota().max-FILES.length:Math.max(0,40-FILES.length);
  if(room<=0){toast(ONLINE?'Limite de votre formule atteinte : supprimez des photos ou passez à une formule plus grande':'Démo : 40 photos maximum');return 0}
  if(list.length>room){toast('Seulement '+room+' photos de plus possibles');list=list.slice(0,room)}
  let done=0,fail=0;upBusy=true;
  for(const f of list){try{const p=await prepPhoto(f);
      const rec={clientId:opts.clientId||null,seanceId:opts.seanceId||null,cat:opts.cat||'',public:!!opts.pub,expire:opts.pub?null:addDays(KEEP),created:today(),size:(p.full?p.full.size:0)+(p.thumb?p.thumb.size:0)};
      if(ONLINE){const r=await fileUpload(p,rec);if(!r)throw new Error('up');FILES.unshift(r)}
      else{rec.id=uid();rec.url=await blobToData(p.full);rec.thumb=await blobToData(p.thumb);FILES.unshift(rec)}
      done++}catch(e){fail++}
    onp&&onp(done+fail,list.length)}
  upBusy=false;if(!ONLINE)save();
  if(fail)toast(fail+' photo(s) pas envoyée(s) : vérifiez internet');return done}
async function filesPatch(ids,patch){ids=[...ids];FILES.forEach(f=>{if(ids.includes(f.id))Object.assign(f,patch)});if(ONLINE)await fileUpdate(ids,patch);else save()}
async function filesRemove(ids){ids=[...ids];const rm=FILES.filter(f=>ids.includes(f.id));FILES=FILES.filter(f=>!ids.includes(f.id));if(ONLINE)await fileDelete(rm);else{S.files=FILES;save()}}
function cleanupExpired(){const old=FILES.filter(f=>!f.public&&f.expire&&f.expire<today());if(old.length)filesRemove(old.map(f=>f.id))}

/* ---------- save photos on the phone (client) ---------- */
let PREP=null;
async function fetchFiles(list,onp){const out=[];let k=0;for(const f of list){try{const r=await fetch(f.url);const b=await r.blob();out.push(new File([b],'photo-'+(++k)+'.jpg',{type:b.type||'image/jpeg'}))}catch(e){}onp&&onp(out.length,list.length)}return out}
async function shareOrDownload(files){
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  for(const f of files){const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,350));setTimeout(()=>URL.revokeObjectURL(u),4000)}return true}

function render(){

  $('#aname').textContent=S.shop.nom;renderHdr();
  const nNew=S.demandes.filter(d=>d.statut==='nouveau').length;
  const tabs=mode==='studio'

function sesSheet(id){const s=ses_(id);if(!s)return;const c=client(s.clientId)||{nom:'?',tel:''};const i=SSTEPS.indexOf(s.statut);const r=reste(s);const fs=filesOf(s.id);

  ${r||!num(s.prix)?`<div class="two"><div class="f"><label for="pay-m">Paiement</label><input id="pay-m" inputmode="numeric" placeholder="${r||''}"></div><div class="f"><label for="pay-mo">Par</label><select id="pay-mo">${opts(MODES)}</select></div></div><button class="btn gold" data-act="ses-pay" data-id="${s.id}">Ajouter le paiement</button>`:''}</div>

  <div class="two"><div class="f"><label for="cr-d">Date</label><input type="date" id="cr-d" value="${addDays(7)}" min="${today()}"></div><div class="f"><label for="cr-h">Heure</label><input type="time" id="cr-h"></div></div>`}
  <div class="f"><label for="cr-l">Lieu</label><input id="cr-l" placeholder="${a?'ex. maison familiale':'ex. Mairie de Mermoz'}"></div>
  <div class="f"><label for="cr-t">Message (facultatif)</label><textarea id="cr-t" placeholder="ex. nous serons 6 personnes"></textarea></div>${c?'':guestFields()}</div>
  <button class="btn gold block" data-act="cr-send" data-id="${a?a.id:''}">Envoyer la réservation</button>`)}
function cQuestion(){sheet('Poser une question',`<div class="panel"><div class="f"><label for="cm-t">Votre question</label><textarea id="cm-t"></textarea></div>${me()?'':guestFields()}</div><button class="btn block" data-act="cq-send">Envoyer</button>`)}
function guestCheck(){const nom=val('vz-nom'),tel=val('vz-tel');if(nom.length<2){toast('Écrivez votre nom');return null}if(tel.replace(/\D/g,'').length<9){toast('Écrivez votre numéro WhatsApp');return null}saveGuest(nom,tel);return {nom,tel}}
async function clientSend(d,btn){const c=me();if(!c){const g=guestCheck();if(!g)return;d.clientId=null;d.nomV=g.nom;d.telV=g.tel}else d.clientId=c.id;return sendDem(d,btn)}
function ensureClient(d){if(client(d.clientId))return d.clientId;const ph=String(d.telV||'').replace(/\D/g,'').slice(-9);let ex=ph.length===9&&S.clients.find(c=>String(c.tel).replace(/\D/g,'').slice(-9)===ph);
  if(!ex){ex={id:uid(),nom:d.nomV||'Nouveau client',tel:d.telV||'',note:'',code:newCode(),autorise:false};S.clients.push(ex);save()}return ex.id}

const SKIP='script,style,textarea,.aname,.eyebrow,.row-t,.card-t,.code,.linkbox,[data-notr]';
function trNode(n){if(LANG!=='wo'||!n)return;
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(SKIP))return;const v=n.nodeValue,t=v.trim();if(!t||!/[A-Za-zÀ-ÿ]/.test(t))return;const r=trWo(t);if(r!==t)n.nodeValue=v.replace(t,r);return}
  if(n.nodeType!==1||n.closest(SKIP))return;
  const ph=el=>{const t=(el.getAttribute('placeholder')||'').trim();if(t){const r=trWo(t);if(r!==t)el.setAttribute('placeholder',r)}};
  if(n.hasAttribute('placeholder'))ph(n);
  const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let c;
  while((c=tw.nextNode())){if(c.nodeType===3)trNode(c);else if(c.hasAttribute('placeholder')&&!c.closest(SKIP))ph(c)}}

function dataToBlob(u){const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})}
async function upPhoto(u,folder){if(!ONLINE||!SB||!u||!/^data:image\/(jpeg|png|webp)/.test(u))return u;
  try{return await upBlob(folder+'/annonces/'+Date.now().toString(36)+uid()+'.jpg',dataToBlob(u))}catch(e){return ''}}
